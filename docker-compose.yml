services:
  db:
    image: mariadb:11
    environment: {MYSQL_DATABASE: wp, MYSQL_USER: wp, MYSQL_PASSWORD: wp, MYSQL_ROOT_PASSWORD: root}
    volumes: [dbdata:/var/lib/mysql]
  wordpress:
    image: wordpress:php8.3-apache
    depends_on: [db]
    ports: ["8080:80"]
    environment: {WORDPRESS_DB_HOST: db, WORDPRESS_DB_USER: wp, WORDPRESS_DB_PASSWORD: wp, WORDPRESS_DB_NAME: wp}
    volumes:
      - wpdata:/var/www/html
      - ./wp-content/themes/baobab-gourmand:/var/www/html/wp-content/themes/baobab-gourmand
  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on: [wordpress]
    environment: {WORDPRESS_DB_HOST: db, WORDPRESS_DB_USER: wp, WORDPRESS_DB_PASSWORD: wp, WORDPRESS_DB_NAME: wp}
    volumes:
      - wpdata:/var/www/html
      - ./wp-content/themes/baobab-gourmand:/var/www/html/wp-content/themes/baobab-gourmand
      - ./setup.sh:/setup/setup.sh
      - ./content:/setup/content
    profiles: [tools]
volumes: {dbdata: {}, wpdata: {}}
